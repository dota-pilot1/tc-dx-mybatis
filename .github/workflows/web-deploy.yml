name: Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      wait_for_invalidation:
        description: Wait until CloudFront invalidation is completed
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: tc-toolkit-web-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: hibot-docu-front-hyun0316
  CLOUDFRONT_DISTRIBUTION_ID: E1L7QZR4LQV4LE
  FRONTEND_URL: https://hibot-docu.com

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        id: invalidate
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          echo "id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for invalidation
        if: ${{ github.event_name == 'push' || inputs.wait_for_invalidation }}
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "${{ steps.invalidate.outputs.id }}"

      - name: Smoke check
        run: curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL"
